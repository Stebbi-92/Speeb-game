name = "brelm-lobby"
main = "lobby-worker.js"
compatibility_date = "2025-01-01"
# Keep variables set in the Cloudflare dashboard when a push deploys (the TURN key, if set as text)
keep_vars = true

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "REPORTS"
class_name = "Reports"

[[durable_objects.bindings]]
name = "MEET"
class_name = "Meet"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Reports"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Meet"]

[vars]
GITHUB_REPO = "Stebbi-92/Speeb-game"
