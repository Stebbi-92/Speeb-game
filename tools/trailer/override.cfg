; Copied to the project folder only when filming (tools/trailer/render.ps1). Keeps the filming run's
; saves and settings apart from the player's own, and sets the Movie Maker's picture quality and rate.
[application]
config/use_custom_user_dir=true
config/custom_user_dir_name="BrelmTrailer"

[editor]
movie_writer/mjpeg_quality=0.95
movie_writer/fps=60
