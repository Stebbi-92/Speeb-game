# Builds the game and publishes it as a pre-release. It runs ONLY when started by hand
# (Actions > Release > Run workflow); ordinary pushes never start it.
name: Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Godot 4.3 and its export templates
        run: |
          set -e
          base=https://github.com/godotengine/godot/releases/download/4.3-stable
          curl -sSL -o godot.zip "$base/Godot_v4.3-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot" && unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP"/tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm -f godot.zip templates.tpz
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Build
        run: GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" bash tools/release.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release.sh publish
      - name: Refresh the wiki
        # The wiki lives in docs/wiki and is kept by hand; it is pushed as it stands. (tools/wiki.gd, which
        # remade its data pages from the game, is behind the hand-written pages and would undo them, so it
        # is not run here.) A wiki that has never had a page made on github.com cannot be pushed to yet,
        # so this step never fails a release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/wiki_push.sh
